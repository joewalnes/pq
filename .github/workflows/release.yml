name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: pq-darwin-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: pq-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: pq-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install musl tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: |
          SHA=$(git rev-parse --short HEAD)
          DATE=$(TZ=UTC date +'%Y-%m-%d %H:%M')
          VERSION="${DATE} main ${SHA} release"
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            BUILD_VERSION="$VERSION" cross build --release --target ${{ matrix.target }}
          else
            BUILD_VERSION="$VERSION" cargo build --release --target ${{ matrix.target }}
          fi
          cp target/${{ matrix.target }}/release/pq ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x dist/*
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          gh release create latest \
            dist/pq-darwin-arm64 \
            dist/pq-linux-amd64 \
            dist/pq-linux-arm64 \
            --title "Latest" \
            --notes "Built from main at $(git rev-parse --short HEAD)" \
            --latest
