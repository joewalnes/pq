name: Release

# Deliberately NOT triggered by push-to-main: every run mints an irreversible
# `0.1.$(date +%Y%m%d%H%M)` version on npm and PyPI, so a release must be an
# explicit act. `v*` tags do not match the `latest` tag this workflow creates,
# so the release job cannot re-trigger this workflow.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Restrictive default; each job widens only what it needs.
permissions:
  contents: read

jobs:
  # `needs:` cannot reference a job in another workflow file, so CI is pulled
  # in here as a real job via `workflow_call`. This job's conclusion is the
  # conclusion of the whole CI workflow: if any CI job fails, `ci` fails, and
  # every job that needs it is skipped.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: pq-darwin-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: pq-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: pq-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install musl tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: |
          SHA=$(git rev-parse --short HEAD)
          DATE=$(TZ=UTC date +'%Y-%m-%d %H:%M')
          VERSION="${DATE} main ${SHA} release"
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            BUILD_VERSION="$VERSION" cross build --release --target ${{ matrix.target }}
          else
            BUILD_VERSION="$VERSION" cargo build --release --target ${{ matrix.target }}
          fi
          cp target/${{ matrix.target }}/release/pq ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: [build, ci]
    runs-on: ubuntu-latest
    # `gh release create/delete` and the `git push origin :refs/tags/latest`
    # tag deletion below both write to the repo, so this job — and only this
    # job — needs contents: write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x dist/*
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          gh release create latest \
            dist/pq-darwin-arm64 \
            dist/pq-linux-amd64 \
            dist/pq-linux-arm64 \
            --title "Latest" \
            --notes "Built from main at $(git rev-parse --short HEAD)" \
            --latest

  publish-npm:
    needs: [build, release, ci]
    runs-on: ubuntu-latest
    # id-token for `npm publish --provenance`; contents: read for checkout.
    # No write scope: this job only reads the repo and pushes to npm.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set version
        run: |
          VERSION="0.1.$(date +%Y%m%d%H%M)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Prepare and publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          chmod +x dist/*

          # darwin-arm64
          cp dist/pq-darwin-arm64 npm/darwin-arm64/bin/pq
          jq --arg v "$VERSION" '.version = $v' npm/darwin-arm64/package.json > tmp.json && mv tmp.json npm/darwin-arm64/package.json
          cd npm/darwin-arm64 && npm publish --provenance --access public && cd ../..

          # linux-x64
          cp dist/pq-linux-amd64 npm/linux-x64/bin/pq
          jq --arg v "$VERSION" '.version = $v' npm/linux-x64/package.json > tmp.json && mv tmp.json npm/linux-x64/package.json
          cd npm/linux-x64 && npm publish --provenance --access public && cd ../..

          # linux-arm64
          cp dist/pq-linux-arm64 npm/linux-arm64/bin/pq
          jq --arg v "$VERSION" '.version = $v' npm/linux-arm64/package.json > tmp.json && mv tmp.json npm/linux-arm64/package.json
          cd npm/linux-arm64 && npm publish --provenance --access public && cd ../..

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm/pqtool
          jq --arg v "$VERSION" \
            '.version = $v | .optionalDependencies["@pqtool/darwin-arm64"] = $v | .optionalDependencies["@pqtool/linux-x64"] = $v | .optionalDependencies["@pqtool/linux-arm64"] = $v' \
            package.json > tmp.json && mv tmp.json package.json
          npm publish --provenance --access public

  publish-pypi:
    needs: [build, release, ci]
    runs-on: ubuntu-latest
    # id-token for PyPI trusted publishing (OIDC); contents: read for checkout.
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set version
        run: |
          VERSION="0.1.$(date +%Y%m%d%H%M)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build wheels
        run: |
          chmod +x dist/*
          python3 pypi/build_wheels.py --version "$VERSION" --binaries-dir dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi/dist/
