name: Release

# Deliberately NOT triggered by push-to-main: every run publishes irreversible
# versions to npm and PyPI, so a release must be an explicit act by a human.
#
# The version is the tag, minus its leading `v` — nothing else computes one.
# `workflow_dispatch` is a re-run mechanism for an existing tag (pick the tag
# in the ref selector); dispatched from a branch it fails in `preflight`
# before any job can create or publish anything. See the `preflight` job.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Restrictive default; each job widens only what it needs.
permissions:
  contents: read

jobs:
  # Derives the one version string every other job uses, and refuses the run
  # if there isn't one. Runs first and needs nothing, so a bad release attempt
  # costs seconds and creates nothing.
  #
  # Why a job and not a step in each consumer: `publish-npm` and `publish-pypi`
  # used to each run `date +%Y%m%d%H%M` independently, in parallel. Across a
  # minute boundary they published *different* version numbers for the same
  # commit, irreversibly, to two registries. One source, one value.
  preflight:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Derive version from tag
        id: version
        # REF via env, not ${{ }} interpolation into the script: a tag name is
        # attacker-controlled text as far as the shell is concerned.
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/tags/v*) ;;
            *)
              echo "::error::Release must run from a v<semver> tag; got '$REF'."
              echo "::error::Push a tag (git tag v0.1.0 && git push origin v0.1.0),"
              echo "::error::or re-run this workflow with an existing tag as the ref."
              exit 1
              ;;
          esac
          version="${REF#refs/tags/v}"
          # Plain X.Y.Z only. A semver pre-release suffix (`-rc.1`) is not a
          # valid PEP 440 version, so it would publish under a different
          # string on PyPI than on npm - the exact divergence this job exists
          # to prevent. Supporting pre-releases means normalising per registry
          # first; until then, reject them loudly.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$REF' does not yield a plain X.Y.Z version (got '$version')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing version $version"

  # `needs:` cannot reference a job in another workflow file, so CI is pulled
  # in here as a real job via `workflow_call`. This job's conclusion is the
  # conclusion of the whole CI workflow: if any CI job fails, `ci` fails, and
  # every job that needs it is skipped.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Generates THIRD-PARTY-LICENSES for the statically-linked dependencies
  # (see Makefile's `licenses` target / DIARY.md 2026-09-02). It is not
  # committed to the repo (it tracks Cargo.lock exactly and would go stale
  # silently), so it must be built here and handed to the jobs that embed
  # it. cargo-about is pinned to an exact version, not a floating install,
  # because this workflow publishes to public registries.
  licenses:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-about (pinned)
        run: cargo install cargo-about --locked --version 0.9.2 --features cli

      - name: Generate THIRD-PARTY-LICENSES
        run: make licenses

      - name: Upload THIRD-PARTY-LICENSES
        uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          # The root copy and the 4 npm/<pkg>/ copies `make licenses` writes
          # are byte-identical (it generates once and fans the file out), so
          # uploading just the root copy is sufficient - publish-npm/
          # publish-pypi each place it where they need it below.
          path: THIRD-PARTY-LICENSES

  build:
    # preflight so a malformed tag stops the run before three build matrix
    # legs spend runner minutes on a version that will be rejected anyway.
    needs: [preflight]
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: pq-darwin-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: pq-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: pq-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install musl tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        env:
          # The release version, from the tag (see the preflight job), so
          # `pq --version` reports the same string the registries published.
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short HEAD)
          DATE=$(TZ=UTC date +'%Y-%m-%d')
          BUILD_VERSION="v${VERSION} (${SHA}) ${DATE}"
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            BUILD_VERSION="$BUILD_VERSION" cross build --release --target ${{ matrix.target }}
          else
            BUILD_VERSION="$BUILD_VERSION" cargo build --release --target ${{ matrix.target }}
          fi
          cp target/${{ matrix.target }}/release/pq ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: [preflight, build, ci]
    runs-on: ubuntu-latest
    # `gh release create` writes to the repo, so this job — and only this
    # job — needs contents: write. It creates one release for the tag that
    # triggered the run and deletes nothing: there is no `gh release delete`
    # and no tag deletion anywhere in this workflow.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Staged into a directory of its own, by explicit name, so a build
      # matrix leg that produced nothing fails here - before the release
      # exists - rather than producing a release that is quietly missing a
      # platform. `cp` of a missing file exits non-zero under `set -e`.
      - name: Stage release assets and checksum them
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp dist/pq-darwin-arm64 dist/pq-linux-amd64 dist/pq-linux-arm64 release-assets/
          chmod +x release-assets/pq-*
          cd release-assets
          # Names listed explicitly, not `*`: a glob would silently include
          # SHA256SUMS itself or omit an asset that failed to stage.
          sha256sum pq-darwin-arm64 pq-linux-amd64 pq-linux-arm64 > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          # Built from the validated version, not from github.ref_name, so a
          # release can only ever be created for a tag preflight accepted.
          TAG="v${VERSION}"
          # --verify-tag: abort rather than create a tag, if the tag has gone
          # away between the push and this job.
          # --latest: makes GitHub's /releases/latest/download/<asset>
          # redirect - the URL README.md documents - resolve here. That
          # pointer is why this workflow no longer needs a mutable `latest`
          # release of its own; see DIARY.md 2026-09-02.
          gh release create "$TAG" \
            release-assets/pq-darwin-arm64 \
            release-assets/pq-linux-amd64 \
            release-assets/pq-linux-arm64 \
            release-assets/SHA256SUMS \
            --title "$TAG" \
            --notes "pq $TAG - built from $(git rev-parse --short HEAD)" \
            --verify-tag \
            --latest

  publish-npm:
    needs: [preflight, build, release, ci, licenses]
    runs-on: ubuntu-latest
    # id-token for `npm publish --provenance`; contents: read for checkout.
    # No write scope: this job only reads the repo and pushes to npm.
    permissions:
      contents: read
      id-token: write
    env:
      # The single version for the whole run, from the tag. Nothing in this
      # job may compute a version of its own.
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Download third-party licenses
        uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
          path: .

      - name: Copy license files into npm packages
        run: |
          # LICENSE (pq's own) is already committed in each npm/<pkg>/
          # directory; only THIRD-PARTY-LICENSES needs placing - it's
          # generated by the `licenses` job, not committed (see there).
          for d in npm/darwin-arm64 npm/linux-arm64 npm/linux-x64 npm/pqtool; do
            cp THIRD-PARTY-LICENSES "$d/"
          done

      - name: Prepare and publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x dist/*

          # darwin-arm64
          cp dist/pq-darwin-arm64 npm/darwin-arm64/bin/pq
          jq --arg v "$VERSION" '.version = $v' npm/darwin-arm64/package.json > tmp.json && mv tmp.json npm/darwin-arm64/package.json
          cd npm/darwin-arm64 && npm publish --provenance --access public && cd ../..

          # linux-x64
          cp dist/pq-linux-amd64 npm/linux-x64/bin/pq
          jq --arg v "$VERSION" '.version = $v' npm/linux-x64/package.json > tmp.json && mv tmp.json npm/linux-x64/package.json
          cd npm/linux-x64 && npm publish --provenance --access public && cd ../..

          # linux-arm64
          cp dist/pq-linux-arm64 npm/linux-arm64/bin/pq
          jq --arg v "$VERSION" '.version = $v' npm/linux-arm64/package.json > tmp.json && mv tmp.json npm/linux-arm64/package.json
          cd npm/linux-arm64 && npm publish --provenance --access public && cd ../..

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd npm/pqtool
          jq --arg v "$VERSION" \
            '.version = $v | .optionalDependencies["@pqtool/darwin-arm64"] = $v | .optionalDependencies["@pqtool/linux-x64"] = $v | .optionalDependencies["@pqtool/linux-arm64"] = $v' \
            package.json > tmp.json && mv tmp.json package.json
          npm publish --provenance --access public

  publish-pypi:
    needs: [preflight, build, release, ci, licenses]
    runs-on: ubuntu-latest
    # id-token for PyPI trusted publishing (OIDC); contents: read for checkout.
    permissions:
      contents: read
      id-token: write
    environment: pypi
    env:
      # Same single version as publish-npm, from the same job output.
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Download third-party licenses
        uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
          # Repo root: build_wheels.py reads LICENSE (already checked out)
          # and THIRD-PARTY-LICENSES (placed here) directly from there and
          # fails loudly if either is missing.
          path: .

      - name: Build wheels
        run: |
          set -euo pipefail
          chmod +x dist/*
          python3 pypi/build_wheels.py --version "$VERSION" --binaries-dir dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi/dist/
